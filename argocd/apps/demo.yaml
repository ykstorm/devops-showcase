# Child app: demo (the canary subject).
#
# Points at this repo's helm/demo chart with the dev values file, which
# sets rollout.enabled=true — so ArgoCD renders the Argo Rollout +
# AnalysisTemplate (real Prometheus success-rate gate) rather than the
# plain Deployment. Installed into the `app` namespace, matching the
# Makefile NAMESPACE and the documented
# `kubectl argo rollouts get rollout demo -n app` command.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stackup
spec:
  project: default
  source:
    repoURL: https://github.com/ykstorm/stackup
    path: helm/demo
    targetRevision: main
    helm:
      valueFiles:
        - values.dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
