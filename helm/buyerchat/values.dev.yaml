# Overrides for the local kind cluster.
#
# - Single replica: the kind cluster is single-node and the showcase
#   doesn't need redundancy. Day 4 (Argo Rollouts canary) bumps this
#   back to 2 to make the canary steps visible.
# - Resources lowered: kind shares the laptop's cores and RAM with
#   Docker Desktop and everything else. The production defaults
#   (500m/512Mi limit) are conservative but on a busy laptop the
#   pod can sit Pending waiting for cpu allocation. Halving them
#   keeps the smoke path snappy.

replicaCount: 1

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "384Mi"
