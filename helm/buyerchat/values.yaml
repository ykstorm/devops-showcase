# Default values for the buyerchat chart.
# Production-shaped; values.dev.yaml overrides for the kind cluster.

image:
  repository: ghcr.io/ykstorm/buyerchat
  # Pinned to an immutable SHA. The trade-offs entry on Day 7 documents
  # why we never use :latest or a moving branch tag.
  tag: sha-84c37cc
  pullPolicy: IfNotPresent

replicaCount: 2

# Progressive delivery. When rollout.enabled is false (the default), the
# chart renders a plain Deployment using the `strategy` block below. When
# true (set in values.dev.yaml for the kind cluster), the chart renders an
# Argo Rollout with a canary strategy + AnalysisTemplate instead, and the
# Deployment is suppressed — exactly one workload object exists either way.
rollout:
  enabled: false
  analysis:
    # The kube-prometheus-stack `kps` release exposes Prometheus here.
    prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
    interval: 30s
    count: 3
    failureLimit: 1
    # successCondition is `result[0] >= successThreshold`. With the
    # current up-based query (see analysis-template.yaml TODO), 0.95 means
    # at least 95% of buyerchat targets must be scrapeable.
    successThreshold: "0.95"

# Deployment update strategy. RollingUpdate is fine here (no hostPort
# contention — the workload runs behind a Service, not directly on
# host ports). Only used when rollout.enabled is false.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Restricted-PSS-compliant security context. See
# manifests/buyerchat/20-deployment.yaml for the original Day-2
# rationale (image runs as UID 1001, drops all caps, read-only root,
# emptyDir for the few writable paths Next.js needs).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  host: buyerchat.localtest.me
  tls:
    enabled: true
    secretName: buyerchat-tls
    clusterIssuer: selfsigned
  # Path is "/" + Prefix — the Next.js app handles all routing
  # internally; ingress just terminates TLS and forwards.
  path: /
  pathType: Prefix

networkPolicy:
  enabled: true
  # Label key/value used to identify the ingress-nginx controller
  # namespace in the allow-from-ingress-controller policy. The chart
  # installed via infra/ingress-nginx/values.yaml puts the controller
  # in `ingress-nginx` ns; kubectl labels every ns with
  # `kubernetes.io/metadata.name: <ns name>` automatically (k8s 1.21+).
  ingressControllerNamespaceLabel:
    key: kubernetes.io/metadata.name
    value: ingress-nginx
  # Same label scheme for the monitoring namespace (kube-prometheus-stack
  # is installed there). Used by the templates' ingress NetworkPolicy
  # to allow Prometheus pods to reach buyerchat:3000 for /api/metrics
  # scrape. Only takes effect when serviceMonitor.enabled is true.
  monitoringNamespaceLabel:
    key: kubernetes.io/metadata.name
    value: monitoring

# ServiceMonitor for kube-prometheus-stack to scrape /api/metrics. The
# chart-installed Prometheus operator (release name `kps`) has
# serviceMonitorSelectorNilUsesHelmValues=false in
# infra/kube-prometheus-stack/values.yaml, so it picks up SMs cluster-
# wide regardless of release label — but we set release: kps anyway as
# a defence-in-depth signal of intended ownership.
serviceMonitor:
  enabled: true
  path: /api/metrics
  port: http
  interval: 30s
  scrapeTimeout: 10s
  # Label that the kube-prometheus-stack operator's selector matches.
  # Override at install time if a different release name is in use.
  releaseLabel: kps

# Probes — preserved from manifests/buyerchat/20-deployment.yaml.
# tcpSocket, NOT httpGet. Day-2 documented the why:
#
#   /api/healthcheck returns 503 in degraded mode (no DB connection in
#   the showcase cluster — see docs/P3-SCOPE.md §2.2 + findings.md
#   Q-12). Kubelet HTTP probes treat any non-2xx/3xx as failure
#   regardless of probe type (startup/readiness/liveness), so HTTP
#   probing /api/healthcheck would CrashLoopBackOff the pod on the
#   very response the showcase is built around. TCP probe checks port
#   availability only — Next.js binds :3000 within ~1s of boot, probe
#   passes, liveness/readiness take over.
probes:
  startup:
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 3
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
