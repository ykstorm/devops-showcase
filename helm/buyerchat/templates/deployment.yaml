{{- if not .Values.rollout.enabled }}
# Plain Deployment — the default path. When .Values.rollout.enabled is
# true (values.dev.yaml), rollout.yaml renders an Argo Rollout instead and
# this file produces nothing, so exactly one workload object exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buyerchat.fullname" . }}
  labels:
    {{- include "buyerchat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "buyerchat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "buyerchat.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: buyerchat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: buyerchat-env
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # Restricted PSS + readOnlyRootFilesystem requires every
            # writable path to be an explicit volume. /tmp + the Next.js
            # standalone build's runtime cache directory are the two
            # paths the image is known to write to.
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # tcpSocket startupProbe — NOT httpGet. /api/healthcheck
          # returns 503 in degraded mode, and kubelet HTTP probes treat
          # any non-2xx/3xx as failure regardless of probe type
          # (startup/readiness/liveness), so HTTP probing the degraded
          # healthcheck would CrashLoopBackOff the pod. TCP probes only
          # check port availability; Next.js binds :3000 within ~1s of
          # boot, the probe passes, and the pod becomes Ready. See
          # the security notes (entry) for the
          # incident that produced this rule.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
{{- end }}
