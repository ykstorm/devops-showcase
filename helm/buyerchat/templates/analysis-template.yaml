{{- if .Values.rollout.enabled }}
# AnalysisTemplate for the buyerchat canary. The Rollout's `analysis` step
# (after the 25% weight) runs this; if successCondition fails more than
# failureLimit times, the Rollout aborts and rolls back.
#
# Prometheus address: the kube-prometheus-stack release `kps` exposes its
# Prometheus at this service (see infra/kube-prometheus-stack/README.md).
#
# TODO: replace the `up`-based query with a real success-rate metric once
# buyerchat exports request counters on /api/metrics. The showcase app
# runs degraded (no DB) and its exported metric names are not confirmable
# from this repo, so this template uses a conservative liveness query —
# the fraction of buyerchat targets Prometheus reports as scrapeable. It
# evaluates a real signal (is the canary up and being scraped?) without
# claiming a request-success-rate gate that cannot actually be computed.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "buyerchat.fullname" . }}-success-rate
  labels:
    {{- include "buyerchat.labels" . | nindent 4 }}
spec:
  metrics:
    - name: success-rate
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      successCondition: result[0] >= {{ .Values.rollout.analysis.successThreshold }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress }}
          query: >-
            sum(up{job="{{ include "buyerchat.fullname" . }}"})
            /
            count(up{job="{{ include "buyerchat.fullname" . }}"})
{{- end }}
