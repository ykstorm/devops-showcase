{{- if .Values.networkPolicy.enabled -}}
# Ingress allow rules for the buyerchat pod.
#
# Day-2 had a single allow rule (same-namespace pods → buyerchat:3000)
# because no Ingress controller existed yet — port-forward via the
# apiserver was the only access path, and that doesn't traverse pod-
# to-pod networking. With Day-3 ingress-nginx in front, requests
# arrive from the controller's pod (in the `ingress-nginx` namespace),
# which is a *different* namespace than buyerchat — the same-ns
# selector would deny those flows.
#
# This template encodes both allow paths:
#   1. From any pod in the ingress-nginx namespace
#      (selected via the chart-configurable namespace label).
#   2. From any pod in the buyerchat namespace itself
#      (preserved from the Day-2 manifest).
#
# Both are funneled through the same `ingress` block as separate
# `from` entries (OR semantics — a flow from either source passes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "buyerchat.fullname" . }}-allow-ingress
  labels:
    {{- include "buyerchat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "buyerchat.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.ingressControllerNamespaceLabel.key }}: {{ .Values.networkPolicy.ingressControllerNamespaceLabel.value }}
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
