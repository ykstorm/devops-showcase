{{- if .Values.networkPolicy.enabled -}}
# Without this allow rule the buyerchat pod cannot resolve any
# hostname (kube-dns at kube-system/coredns is the default cluster
# DNS). Even degraded-mode startup typically tries DNS lookups for
# upstreams, so denying DNS produces noisy error logs even though the
# acceptance criterion (any healthcheck response) would still pass.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "buyerchat.fullname" . }}-allow-dns-egress
  labels:
    {{- include "buyerchat.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
