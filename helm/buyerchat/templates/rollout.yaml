{{- if .Values.rollout.enabled }}
# Argo Rollout — the canary equivalent of deployment.yaml. Exactly one of
# Deployment/Rollout renders: this file is gated on .Values.rollout.enabled,
# deployment.yaml on `not .Values.rollout.enabled`.
#
# MAINTENANCE: the pod template below is a verbatim copy of the one in
# deployment.yaml (same containers, securityContext, volumeMounts, the
# tcpSocket probes + their rationale, volumes, automountServiceAccountToken).
# Any change to the buyerchat pod spec must be made in BOTH files until the
# template is extracted into a shared _helpers.tpl named template.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "buyerchat.fullname" . }}
  labels:
    {{- include "buyerchat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: {{ include "buyerchat.fullname" . }}-success-rate
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 75
        - pause: { duration: 30s }
        - setWeight: 100
  selector:
    matchLabels:
      {{- include "buyerchat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "buyerchat.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: buyerchat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: buyerchat-env
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # Restricted PSS + readOnlyRootFilesystem requires every
            # writable path to be an explicit volume. /tmp + the Next.js
            # standalone build's runtime cache directory are the two
            # paths the image is known to write to.
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # tcpSocket startupProbe — NOT httpGet. /api/healthcheck
          # returns 503 in degraded mode, and kubelet HTTP probes treat
          # any non-2xx/3xx as failure regardless of probe type
          # (startup/readiness/liveness), so HTTP probing the degraded
          # healthcheck would CrashLoopBackOff the pod. TCP probes only
          # check port availability; Next.js binds :3000 within ~1s of
          # boot, the probe passes, and the pod becomes Ready. See
          # docs/diagnostics/p3-week1/progress.md (Day-2 entry) for the
          # incident that produced this rule.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
{{- end }}
