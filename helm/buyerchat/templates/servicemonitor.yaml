{{- if .Values.serviceMonitor.enabled -}}
# ServiceMonitor wires the kube-prometheus-stack Prometheus operator
# (release `kps` in the `monitoring` namespace) to scrape the
# /api/metrics endpoint exposed by Phase B.
#
# Companion changes:
#   - helm/buyerchat/templates/networkpolicy-ingress.yaml extends its
#     `from:` list with the monitoring namespace so Prometheus pods
#     can reach buyerchat:3000 (the chart's default-deny would
#     otherwise block the scrape).
#   - infra/kube-prometheus-stack/values.yaml has
#     serviceMonitorSelectorNilUsesHelmValues=false so the operator
#     adopts SMs cluster-wide, but the `release: kps` label is set
#     here anyway as defence-in-depth (the operator default selector
#     would otherwise require it).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "buyerchat.fullname" . }}
  labels:
    {{- include "buyerchat.labels" . | nindent 4 }}
    release: {{ .Values.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels:
      {{- include "buyerchat.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: {{ .Values.serviceMonitor.port }}
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
