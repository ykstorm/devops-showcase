{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "buyerchat.fullname" . }}
  labels:
    {{- include "buyerchat.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    # cert-manager observes this annotation and creates a Certificate
    # CR for {{ .Values.ingress.tls.secretName }} resolved against the
    # named ClusterIssuer. The resulting key+cert lands in the named
    # Secret; ingress-nginx mounts it on the TLS handshake.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "buyerchat.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
