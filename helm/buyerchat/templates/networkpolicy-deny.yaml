{{- if .Values.networkPolicy.enabled -}}
# Default-deny: every pod selected by this policy refuses both
# ingress and egress unless an explicit allow policy lets a flow
# through. The empty podSelector matches every pod in the namespace.
# Calico (the cluster CNI — see kind/calico/README.md) enforces both
# directions; kindnet only honors the ingress half, which is one of
# the reasons we explicitly disabled it on the kind config.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "buyerchat.fullname" . }}-default-deny
  labels:
    {{- include "buyerchat.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
