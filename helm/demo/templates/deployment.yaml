{{- if not .Values.rollout.enabled }}
# Plain Deployment — the default path. When .Values.rollout.enabled is
# true (values.dev.yaml), rollout.yaml renders an Argo Rollout instead and
# this file produces nothing, so exactly one workload object exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo.fullname" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- include "demo.container" . | nindent 8 }}
{{- end }}
