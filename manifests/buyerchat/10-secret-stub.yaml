# Day-2 stub Secret. Day 3 replaces this file with a SealedSecret
# committed in encrypted form. NONE of these values are real — the
# string `demo-not-real` and the `example.invalid` host are designed
# to look unmistakably stubbed. Anything that grep'd them in a leaked
# repo would immediately know they're synthetic.
apiVersion: v1
kind: Secret
metadata:
  name: buyerchat-env
  namespace: buyerchat
  labels:
    app.kubernetes.io/name: buyerchat
    app.kubernetes.io/component: env
    showcase.devops/source: stub-day2  # marker — Day-3 SealedSecret drops this
type: Opaque
stringData:
  DATABASE_URL: "postgres://demo:demo@example.invalid:5432/demo?sslmode=disable"
  DIRECT_DATABASE_URL: "postgres://demo:demo@example.invalid:5432/demo?sslmode=disable"
  OPENAI_API_KEY: "sk-demo-not-real"
  ANTHROPIC_API_KEY: "sk-ant-demo-not-real"
  NEXTAUTH_SECRET: "demo-not-real-nextauth-secret-padded-to-32"
  NEXTAUTH_URL: "http://localhost:3000"
  SENTRY_DSN: ""  # empty disables Sentry init
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
