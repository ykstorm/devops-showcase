# ArgoCD values for the showcase cluster.
#
# Values for the upstream chart are nested under its dependency alias
# `argo-cd` (the dependency name in Chart.yaml).
#
# Kept minimal: server + repo-server + application-controller, with an
# ingress on argocd.local.stackup.dev. TLS is terminated at the ingress
# by cert-manager (the selfsigned ClusterIssuer), and the server runs in
# insecure mode behind it so there is no double-TLS hop.

argo-cd:
  configs:
    params:
      # The ingress terminates TLS via cert-manager. Running the server
      # insecure (plain HTTP) behind it avoids the controller serving its
      # own self-signed cert on top of the ingress cert (a redirect loop
      # / handshake mismatch). Standard pattern for ingress-fronted ArgoCD.
      server.insecure: true

  server:
    # Single replica on a single-node kind cluster.
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    ingress:
      enabled: true
      ingressClassName: nginx
      # The Makefile already prints this host in its /etc/hosts hint.
      hostname: argocd.local.stackup.dev
      annotations:
        cert-manager.io/cluster-issuer: selfsigned
      tls: true
      # The chart names the TLS secret <hostname>-tls when tls: true and
      # no explicit secret is given; cert-manager fills it via the
      # selfsigned issuer above.

  # Trim the optional sub-components — not needed for the app-of-apps demo.
  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    enabled: false
