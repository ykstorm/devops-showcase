name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint manifests + helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform + helm
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp/
          chmod +x /tmp/kubeconform && sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.15.0-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp/
          chmod +x /tmp/linux-amd64/helm && sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Validate raw manifests
        run: find manifests/ -name '*.yaml' -print0 | xargs -0 kubeconform -strict -summary

      - name: Lint helm chart
        run: helm lint helm/buyerchat

      - name: Template helm + validate
        run: helm template helm/buyerchat | kubeconform -strict -summary -ignore-missing-schemas

  e2e:
    name: E2E (make up on kind)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install kind, kubectl, helm
        run: |
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
          chmod +x /tmp/kubectl && sudo mv /tmp/kubectl /usr/local/bin/kubectl
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.15.0-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp/
          chmod +x /tmp/linux-amd64/helm && sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: make up
        run: make up

      - name: Wait for ArgoCD root app
        run: |
          for i in {1..60}; do
            STATE=$(kubectl get application root -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "")
            if [ "$STATE" = "Synced" ]; then echo "synced"; exit 0; fi
            echo "waiting: $STATE"
            sleep 10
          done
          kubectl get applications -n argocd
          exit 1

      - name: Smoke test
        run: bash scripts/smoke.sh

      - name: make down
        if: always()
        run: make down || true

      - name: Capture artifacts on failure
        if: failure()
        run: |
          mkdir -p /tmp/k8s-state
          kubectl get all -A > /tmp/k8s-state/all.txt 2>&1 || true
          kubectl describe pods -A > /tmp/k8s-state/pods.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: k8s-state
          path: /tmp/k8s-state

  build-docs:
    name: Build docs site
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-site/out
