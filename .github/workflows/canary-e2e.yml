name: Canary e2e

# Proves the canary claim for real: spins a kind cluster, installs Argo Rollouts
# + a live Prometheus, runs steady traffic through the demo workload, then ships
# a new image and watches Argo Rollouts drive a genuine 25→50→75→100 canary —
# advancing ONLY because the AnalysisTemplate's real Prometheus success-rate
# query clears the ≥0.95 gate. No mocked metric, no asserted-by-fiat number.
#
# Separate from ci.yml on purpose: this is the heavier live-cluster job, and
# keeping it out of the CI badge means iterating on it never reds the repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'helm/demo/**'
      - 'apps/demo/**'
      - 'ci/**'
      - '.github/workflows/canary-e2e.yml'

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: stackup

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Install kubectl-argo-rollouts plugin
        run: |
          curl -sSL -o /tmp/kar https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x /tmp/kar && sudo mv /tmp/kar /usr/local/bin/kubectl-argo-rollouts

      - name: Install Argo Rollouts controller
        run: |
          kubectl create namespace argo-rollouts
          kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
          kubectl -n argo-rollouts rollout status deploy/argo-rollouts --timeout=180s

      - name: Build demo image v1 and load into kind
        run: |
          docker build -t stackup-demo:v1 apps/demo
          kind load docker-image stackup-demo:v1 --name stackup

      - name: Namespaces + live Prometheus
        run: |
          kubectl create namespace app
          kubectl apply -f ci/prometheus.yaml
          kubectl -n monitoring rollout status deploy/prometheus --timeout=180s

      - name: Install demo (initial revision, canary Rollout)
        run: |
          helm install demo helm/demo -n app \
            -f helm/demo/values.dev.yaml -f helm/demo/values.ci.yaml \
            --set image.tag=v1
          # First rollout of a fresh Rollout goes straight to 100% (no canary
          # steps on initial create) — just wait for Healthy.
          kubectl argo rollouts status demo -n app --timeout 240s

      - name: Start steady traffic
        run: |
          kubectl apply -f ci/traffic.yaml
          kubectl -n app rollout status deploy/traffic --timeout=120s

      - name: Warm the rate() window
        run: |
          echo "Filling the 1m rate() window with real 2xx traffic before the canary analysis runs..."
          sleep 75
          # Sanity: Prometheus should already see a healthy success ratio.
          kubectl -n monitoring exec deploy/prometheus -- \
            wget -qO- 'http://localhost:9090/api/v1/query?query=sum(rate(http_requests_total%7Bservice%3D%22demo%22%2Ccode%3D~%222..%22%7D%5B1m%5D))/sum(rate(http_requests_total%7Bservice%3D%22demo%22%7D%5B1m%5D))' || true

      - name: Ship v2 → drive a real canary through the gate
        run: |
          docker build -t stackup-demo:v2 apps/demo
          kind load docker-image stackup-demo:v2 --name stackup
          helm upgrade demo helm/demo -n app \
            -f helm/demo/values.dev.yaml -f helm/demo/values.ci.yaml \
            --set image.tag=v2
          echo "Watching the canary advance (blocks until Healthy, or non-zero if it aborts)..."
          kubectl argo rollouts status demo -n app --watch --timeout 480s

      - name: Assert canary completed via the analysis gate
        run: |
          set -e
          PHASE=$(kubectl argo rollouts get rollout demo -n app -o jsonpath='{.status.phase}')
          echo "Rollout phase: $PHASE"
          kubectl argo rollouts get rollout demo -n app | tee /tmp/rollout.txt
          echo "--- AnalysisRuns ---"
          kubectl -n app get analysisrun -o custom-columns=NAME:.metadata.name,PHASE:.status.phase | tee /tmp/analysis.txt
          # Gate: the rollout must be Healthy AND at least one AnalysisRun must
          # have Succeeded — that's the real Prometheus success-rate check passing.
          test "$PHASE" = "Healthy"
          kubectl -n app get analysisrun -o jsonpath='{.items[*].status.phase}' | grep -q Successful

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-proof
          path: |
            /tmp/rollout.txt
            /tmp/analysis.txt
